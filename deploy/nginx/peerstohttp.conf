# ==============================================================================
# peerstohttp 站点配置（nginx 公网入口）
#
# 放置位置：/etc/nginx/conf.d/peerstohttp.conf
# 适用系统：Debian / Ubuntu（只用 nginx 内置模块，无需第三方编译）
#
# ------------------------------------------------------------------------------
# 部署步骤
# ------------------------------------------------------------------------------
# 1) 装依赖
#      sudo apt update
#      sudo apt install -y nginx apache2-utils
#
# 2) 生成访问口令（只需执行一次）
#      sudo htpasswd -c -B /etc/nginx/.htpasswd 你的用户名
#      # -B 表示 bcrypt；-c 只在第一次创建文件时用，以后加用户要去掉 -c
#      sudo chown root:www-data /etc/nginx/.htpasswd
#      sudo chmod 640 /etc/nginx/.htpasswd
#      # 权限不对会变成 500 而不是 401
#
# 3) 停用发行版默认站点，否则会和本文件的 default_server 冲突
#      sudo rm -f /etc/nginx/sites-enabled/default
#
# 4) 把本文件拷到 /etc/nginx/conf.d/peerstohttp.conf
#
# 5) 校验并重载
#      sudo nginx -t && sudo systemctl reload nginx
#
# 6) 放行端口（同时确认云厂商安全组已开 80 与 6881）
#      sudo ufw allow 80/tcp
#      sudo ufw allow 6881/tcp
#      sudo ufw allow 6881/udp
#
# ------------------------------------------------------------------------------
# 验证清单（按顺序执行，状态码就是结论）
# ------------------------------------------------------------------------------
#   curl -sI http://storage.yinghuoanime.top/list/json/-/-/hash/zzz
#       401  -> 鉴权生效
#   curl -sI -u 用户:密码 http://storage.yinghuoanime.top/list/json/-/-/hash/zzz
#       400  -> 口令正确且服务活着（zzz 不是合法 info hash）
#   curl -sI -u 用户:密码 http://storage.yinghuoanime.top/debug/pprof/
#       404  -> pprof 被挡住
#   curl -sI -X POST -u 用户:密码 http://storage.yinghuoanime.top/list/json/-/-/hash/zzz
#       405  -> 非读请求被拒
#   curl -sI http://服务器公网IP/list/json/-/-/hash/zzz
#       连接被重置/无响应 -> 444 兜底生效
#   curl -s -u 用户:密码 "http://storage.yinghuoanime.top/list/m3u/mp4/-/hash/08ada5a7a6183aae1e09d831df6748d566095a10"
#       m3u 里应是 http://storage.yinghuoanime.top/content/...，不能出现 127.0.0.1
# ==============================================================================

# ------------------------------------------------------------------------------
# http 上下文：限流区与并发区，必须写在 server 之前
# ------------------------------------------------------------------------------
# 用 $binary_remote_addr 而不是 $remote_addr，省内存。
# 注意：IPv6 是按单个地址计数，持有人若握有 /64 网段可轮换地址绕过限流；
#      个人自用可接受，要堵死需另用 geo 模块聚合成 /64。
limit_req_zone  $binary_remote_addr zone=ps_all:10m     rate=600r/m;
limit_req_zone  $binary_remote_addr zone=ps_list:10m    rate=30r/m;
limit_req_zone  $binary_remote_addr zone=ps_content:10m rate=240r/m;
limit_conn_zone $binary_remote_addr zone=ps_conn:10m;

# ------------------------------------------------------------------------------
# 兜底 server：只接「按 IP 直连」和「Host 对不上」的请求
# 444 表示不回任何响应直接断连，不给扫描器任何信息。
# ------------------------------------------------------------------------------
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    # 若本机还有别的站点需要按 IP 访问，删掉这个 server 块
    return 444;
}

# ------------------------------------------------------------------------------
# 主 server
# ------------------------------------------------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name storage.yinghuoanime.top;

    # 若 nginx -t 报 socket() [::]:80 failed (97: Address family not supported)，
    # 说明机器关了 IPv6，把两行 listen [::] 删掉即可。
    #
    # 若云厂商拦截了未备案域名的 80 端口，可以临时改成 8080，
    # 下面的 $http_host 会自动把端口带进 m3u 链接，不需要改代码。
    # listen      8080;

    # 不在响应头里暴露 nginx 版本
    server_tokens off;

    # --------------------------------------------------------------------------
    # 只放行读请求。peerstohttp 三个端点全是 GET，没有任何写接口，
    # 挡掉 POST/PUT/DELETE 等于直接砍掉一大块攻击面。
    # （server 级 if + return 是官方认可的少数安全用法之一）
    # --------------------------------------------------------------------------
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # --------------------------------------------------------------------------
    # 身份验证
    # 执行顺序上 limit_req 在 auth_basic 之前，所以猜密码同样消耗配额。
    # --------------------------------------------------------------------------
    auth_basic           "peerstohttp";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # 单 IP 并发上限：首次请求会阻塞在等 BT 元数据，并发太高会把 worker 拖死
    limit_conn ps_conn 20;
    limit_conn_status 429;
    limit_req_status  429;

    # 请求体与请求头超时：全是 GET，收紧即可
    client_max_body_size  64k;
    client_body_timeout   10s;
    client_header_timeout 10s;

    # --------------------------------------------------------------------------
    # 反向代理公共设置（server 级，所有 location 继承）
    # --------------------------------------------------------------------------
    proxy_http_version 1.1;

    # 关键一行：必须透传客户端原始 Host（含端口）。
    # nginx 默认值是 $proxy_host，会把播放列表写成 http://127.0.0.1:8484/content/...，
    # 播放器拿到直接播不了。用 $http_host 而非 $host，是为了换非 80 端口时
    # 链接里也能带上端口。
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # 流式转发三件套，缺一项都会表现为起播慢、拖进度条卡死
    proxy_buffering          off;
    proxy_request_buffering  off;
    proxy_max_temp_file_size 0;

    # 首次请求会一直阻塞在等种子元数据（源码里没有超时保护），给足时间
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # 上游自己发的 3xx 不要改写
    proxy_redirect off;

    # 裁掉 peerstohttp 自带的 CORS 通配头。
    # 程序里写死了 Access-Control-Allow-Origin: * 且 AllowCredentials: true，
    # 等于任何网页的 JS 都能驱动这台服务器；在边缘删头即可，不用改 Go 代码。
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Expose-Headers;

    # --------------------------------------------------------------------------
    # pprof 兜底屏蔽：即使有人误加了 -profile，也不让 /debug/* 出网
    # --------------------------------------------------------------------------
    location = /debug    { return 404; }
    location ^~ /debug/  { return 404; }

    # --------------------------------------------------------------------------
    # 列表接口：最贵的端点。
    # 每遇到一个新 hash 就会建种子并写进 bbolt，而项目没有删除种子的 API，
    # 被刷就会持续吃内存和磁盘，所以单独收紧到 30 次/分钟。
    #
    # 注意 limit_req 不叠加继承：当前层一旦出现 limit_req，上层的就不再生效。
    # 因此全局兜底和列表档必须同时写在这里。
    # --------------------------------------------------------------------------
    location ^~ /list/ {
        limit_req zone=ps_all  burst=60 nodelay;
        limit_req zone=ps_list burst=10 nodelay;

        proxy_pass http://127.0.0.1:8484;
    }

    # --------------------------------------------------------------------------
    # 流接口：播放器拖动进度条会连发 Range 请求，阈值要放宽，
    # 否则正常播放会被自己限流。同时关 gzip，避免压缩拖慢流式输出。
    # --------------------------------------------------------------------------
    location ^~ /content/ {
        limit_req zone=ps_all     burst=60  nodelay;
        limit_req zone=ps_content burst=120 nodelay;

        gzip off;

        proxy_pass http://127.0.0.1:8484;
    }

    # --------------------------------------------------------------------------
    # 其余路径只挂全局兜底
    # --------------------------------------------------------------------------
    location / {
        limit_req zone=ps_all burst=60 nodelay;

        proxy_pass http://127.0.0.1:8484;
    }
}

# ==============================================================================
# 可选：升级到 HTTPS（本期未启用）
# ==============================================================================
# 最省事的方式是让 certbot 自己改写配置：
#     sudo apt install -y certbot python3-certbot-nginx
#     sudo certbot --nginx -d storage.yinghuoanime.top
# 它会加 443 的 server、把 80 改成跳转，并注册 systemd timer 自动续期。
#
# 如果想自己掌控配置，就保留上面 80 的 server，另外追加一个 443 的 server，
# 指令与本文件 80 的 server 完全一致，只多两行证书路径：
#
#   server {
#       listen      443 ssl;
#       listen      [::]:443 ssl;
#       server_name storage.yinghuoanime.top;
#
#       ssl_certificate     /etc/letsencrypt/live/storage.yinghuoanime.top/fullchain.pem;
#       ssl_certificate_key /etc/letsencrypt/live/storage.yinghuoanime.top/privkey.pem;
#       ssl_protocols       TLSv1.2 TLSv1.3;
#       ssl_session_cache   shared:SSL:10m;
#       ...其余指令照抄...
#   }
#
# ⚠️ 上了 HTTPS 之后必须同步改一行 Go 代码，否则 m3u 里仍然是 http:// 链接，
#    播放器会去连 80 端口并在跳转时丢掉凭据：
#
#    http/host/host.go 当前逻辑是：
#        if r.TLS != nil { scheme = "https://" } else { scheme = "http://" }
#    改为同时认反向代理传来的头（本配置已经在发 X-Forwarded-Proto）：
#        if r.TLS != nil || strings.EqualFold(r.Header.Get("X-Forwarded-Proto"), "https") {
#            scheme = "https://"
#        } else {
#            scheme = "http://"
#        }
#    并给该文件补上 "strings" 的 import。
# ==============================================================================
